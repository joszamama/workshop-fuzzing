name: Fuzzing

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ejecutar fuzzers
        run: python fuzzers/ci_fuzz.py 15

      - name: Subir entradas que provocan crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes
          path: crashes/
